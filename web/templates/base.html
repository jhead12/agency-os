<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0f1117">
    <title>{% block title %}agency-os{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">agency-os</a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/prospects" class="{% if active == 'prospects' %}active{% endif %}">Prospects</a>
            <a href="/call-scripts" class="{% if active == 'call-scripts' %}active{% endif %}">Call Scripts</a>
            <a href="/call-log" class="{% if active == 'call-log' %}active{% endif %}">Call Log</a>
            <a href="/calendar" class="{% if active == 'calendar' %}active{% endif %}">Calendar</a>
            <a href="/campaigns" class="{% if active == 'campaigns' %}active{% endif %}">Campaigns</a>
            <a href="/email-templates" class="{% if active == 'email-templates' %}active{% endif %}">Templates</a>
            <a href="/emails" class="{% if active == 'emails' %}active{% endif %}">Emails</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
