body: |
  Hi {{contact_first}},

  Here's your page on u9itus:

  {{source_url}}

  To claim it, open the page and choose "Claim this profile". We confirm
  it's you with your campaign email, and then you can:

  - add a photo and your candidate statement
  - link your campaign site and social accounts
  - correct anything we got wrong from the official list

  It's free, and every candidate in the race has the same option.

