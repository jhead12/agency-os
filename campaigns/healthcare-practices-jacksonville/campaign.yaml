# Builds a sellable list of dental and chiropractic practices in the Jacksonville,
# Florida market for tech-company buyers (EHR vendors, practice-management SaaS,
# billing services, marketing agencies). No product plugin: reps verify the
# contacts by phone, then the list is published from Administration -> Sell Lead
# Packages.
name: "Healthcare Practices — Dentists & Chiropractors (Jacksonville FL)"
product: lead_list
prospect_sources:
- npi_registry
enrichers:
- local_scraper
- hunter
channels:
- manual
filters:
  state: FL
  npi_taxonomies:
  - Dentist
  - Chiropractor
  npi_type: organization
  # The NPI API caps a search at 1,200 records: list cities (or postal_codes) to cover more.
  cities:
  - Jacksonville
  - Jacksonville Beach
  - Atlantic Beach
  - Neptune Beach
  - Orange Park
  - Fleming Island
  - Ponte Vedra Beach
  - St. Augustine
  - Fernandina Beach
  - Green Cove Springs
stages:
- cold
- contacted
- engaged
- closed_won
- closed_lost
- nurture
cadence: []
