subject: "How {{org_name}} uses U9itus for voter education"
body: |
  Hi {{contact_first}},

  Wanted to share something concrete.

  U9itus gives civic organizations a nonpartisan voter guide they can share
  with their community: who's on the ballot and what each measure would do,
  in plain language.

  The platform gives {{org_name}}:
  - Verified candidate profiles from public records
  - Ballot measures in plain language
  - Co-branded with your logo, embedded on your site
  - No account required for your voters

  Here's what it looks like live: {{demo_link}}

  Worth a quick 15-min chat?

  {{your_name}}