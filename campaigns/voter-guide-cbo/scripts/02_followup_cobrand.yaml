stage: contacted
subject: "{{org_name}} — co-branded voter guide for your community"
body: |
  Hi {{contact_first}},

  Wanted to highlight one thing that makes this different from other voter
  education tools: your logo, your branding, your website.

  {{org_name}} gets a fully co-branded voter guide that lives at your URL.
  Your constituents see your organization — not us. Candidates side-by-side,
  ballot measures in plain language, printable, available in Spanish, Korean,
  Chinese, and Tagalog.

  The embed takes 5 minutes to drop into your site. We handle all the data
  updates — candidate profiles, ballot measures, election dates — automatically.

  20 minutes to see if it's a fit? {{demo_link}}

  {{your_name}}