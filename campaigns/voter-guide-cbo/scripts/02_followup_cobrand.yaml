key: cbo_followup_cobrand
stage: contacted
subject: "Let's show your voters what they're missing"
body: |
  Hi {{contact_first}},

  Election season is here, and voter registration deadlines are approaching.
  Your constituents need clear, nonpartisan candidate information — and they
  need it now, not after the last debate.

  U9itus gives {{org_name}} a tailored voter guide for your specific district:
  - Your candidates, your ballot measures, your branding
  - Verified public records — no opinions, just facts
  - Available in English, Spanish, Korean, Chinese, and Tagalog
  - Embeds on your website in 5 minutes

  I can set up a demo with {{city}}'s actual candidates and ballot measures
  so you see exactly what your voters would see.

  Reply with your best time this week and I'll send a calendar invite.

  {{your_name}}