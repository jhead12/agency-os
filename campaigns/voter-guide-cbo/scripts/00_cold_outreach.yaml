key: cbo_cold_outreach
stage: cold
subject: "Voters in {{city}} deserve better candidate info"
body: |
  Hi {{contact_first}},

  68% of voters say they lack confidence in their candidate research.
  That's not a voter problem — it's an information problem.

  We built U9itus: one platform, verified public records, no account needed.
  {{org_name}} can distribute a personalized, nonpartisan voter guide to your
  constituents — candidates side-by-side, ballot measures in plain language,
  co-branded with your logo, embeddable on your site.

  Interested in learning how this works for your district?

  {{your_name}}